let AC;function boom(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(28,t+1);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+1.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.3)}catch(e){}}

/* ---------- accounts (server-backed: same account on every device) ---------- */
const API_BASE=location.protocol==='file:'?'http://localhost:3000':'';
let me=null,ME=null,token=localStorage.dx_t||'';const pick={},tot=v=>Object.values(v.prog).reduce((a,p)=>a+Object.values(p.b).reduce((x,y)=>x+y,0),0);

 catch(e){if(srvTok)throw new Error('Cannot reach the game server.');LOCAL=true;return localApi(p,b)}

 if(!r.ok){const e=new Error((j&&j.error)||'Request failed ('+r.status+')');e.code=r.status;throw e}return j||{}}

async function localApi(p,b){const US=LDB.get(),k=n=>String(n||'').toLowerCase();b=b||{};
 if(p=='register'){const n=String(b.username||'');if(!/^[A-Za-z0-9_]{3,16}$/.test(n))throw lerr('Username: 3–16 letters, numbers or _.',400);if(String(b.password||'').length<6)throw lerr('Password must be 6+ characters.',400);if(US[k(n)])throw lerr('That username is taken.',409);
  const s=Math.random().toString(36).slice(2);US[k(n)]={name:n,s,h:await lhash(s+b.password),prog:{1:{u:1,b:{}},2:{u:1,b:{}},3:{u:1,b:{}}}};LDB.set(US);return{token:'local:'+k(n),me:lpub(US[k(n)])}}
 if(p=='login'){const u=US[k(b.username)];if(!u||u.h!==await lhash(u.s+String(b.password||'')))throw lerr('Wrong username or password.',401);return{token:'local:'+k(u.name),me:lpub(u)}}
 if(p=='leaderboard')return Object.values(US).map(u=>[u.name,tot(u)]).sort((a,b)=>b[1]-a[1]).slice(0,10);

 throw lerr('Not found',404)}

/* ---------- state / input ---------- */
const GY=()=>H*(TOUCH?.68:.74),live=()=>G.es.filter(e=>e.hp>0),KM={ArrowLeft:'KeyA',ArrowRight:'KeyD'};
function fight(m,L){const k=kn(L),boss=L%10==0,hp=(70+L*10)*(boss?2:1);ov.hidden=true;closePick();K={};
 G={m,L,k,boss,t:0,end:0,tier:(L-1)/10|0,ed:(6+L*.4)*(boss?1.3:1),paused:0,pk:0,slow:0,eb:0,cb:0,ct:0,cm:0,ft:[],pr:[],pt:[],sl:[],shake:0,flash:0,dx:null,
  p:{x:W*.18,hp:200+L*3,mx:200+L*3,g:0,face:1,jc:0,kc:0,dc:0,inv:0,hit:0,dash:0,dv:0,sel:0,tr:[],pfc:0,buff:0,burn:0,mv:0},es:[]};
 for(let i=0;i<m;i++){const ty=boss?2:L<3?0:(i+L)%4,hm=[1,.8,1.5,.7][ty],h=hp*hm;G.es.push({x:W*(.55+.13*i)+R(0,30),hp:h,mx:h,ty,dm:(Math.random()*k)|0,pref:[R(120,260),380,80,50][ty]*S,cd:R(1,2),pc:R(1.5,3.5),st:0,wd:0,hit:0,dc:L<5?999:R(6,14),sc:boss?1.4:[1,1,1.2,.95][ty],face:-1,burn:0,mv:0})}}
function ft(s,x,y,c){G.ft.push({s,x,y,c,t:0})}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.pt.push({x,y,vx:R(-320,320),vy:R(-420,120),l:R(.3,.7),c})}
function hurtE(e,d,ng){if(e.hp<=0)return;e.hp-=d;e.hit=.1;if(!ng)G.p.g=Math.min(100,G.p.g+d*.3);burst(e.x,GY()-70*S,DM[e.dm].a,ng?2:6);if(e.hp<=0){burst(e.x,GY()-70*S,'#fff',40);G.shake=14}}
function hit(e,d){const g=G;g.cb++;g.ct=2;g.cm=Math.max(g.cm,g.cb);hurtE(e,d*(1+Math.min(g.cb,30)*.02)*(g.p.buff>0?2:1))}
function perfect(){const g=G,p=g.p;if(p.pfc>0)return;p.pfc=.8;g.slow=.7;p.g=Math.min(100,p.g+18);ft('完璧 PERFECT',p.x,GY()-200*S,'#ffd34d');g.flash=.25}
function hurtP(d,q){const g=G,p=g.p;if(p.inv>0&&!q){if(p.dash>0)perfect();return}p.hp-=d*(g.eb>0?1.5:1);p.g=Math.min(100,p.g+d*.5);if(!q){g.cb=0;p.hit=.15;g.shake=Math.max(g.shake,9);burst(p.x,GY()-70*S,DM[p.sel].a,10)}}
function melee(){const g=G,p=g.p;if(p.jc>0)return;p.jc=.3;g.sl.push({x:p.x,f:p.face,t:0,c:DM[p.sel].a});for(const e of live()){const d=(e.x-p.x)*p.face;if(d>-30&&d<150*S)hit(e,12+g.L*.5)}}
function blast(){const g=G,p=g.p;if(p.kc>0)return;p.kc=Math.max(.25,.7-g.tier*.1);const d=(14+g.L*.5)*(1+g.tier*.2),n=g.tier>=2?3:1;for(let i=0;i<n;i++)g.pr.push({x:p.x+p.face*(40-i*50)*S,y:GY()-80*S,vx:p.face*620*S,o:0,d,c:DM[p.sel].a,pi:g.tier>=1,h:[]})}
function act(c){if(!G||G.end||G.paused||!ov.hidden)return;const p=G.p;if(G.pk){if(c=='KeyL')closePick();return}
 if(c=='KeyJ')melee();else if(c=='KeyK')blast();else if(c=='KeyL')castP();
 else if(c=='Space'&&p.dc<=0){p.dc=.8;p.dash=.18;p.inv=.3;p.dv=((K.KeyD?1:0)-(K.KeyA?1:0)||p.face)*1100*S}}
function castP(){const g=G,p=g.p;if(p.g<100)return;if(g.dx){if(g.dx.who==1&&g.dx.ph=='h'){g.dx.ph='o';g.dx.t=0;live().forEach(e=>e.st=1.2);p.g=0;g.flash=1;g.shake=30;boom();ft('CLASH!',p.x,GY()-200*S,'#fff')}return}openPick()}

  ov.innerHTML=`<div class=card><h1>${g.L>=50?'傳説':'勝利'}</h1><h2>LEVEL ${g.L} CLEARED</h2><p>Score +${sc.toLocaleString()} · best combo x${g.cm} · total ${tot(ME).toLocaleString()}</p>${nd}${off}${g.L<50?'<button data-n>Next level</button>':''}<button data-m>Menu</button></div>`}
  else ov.innerHTML=`<div class=card><h1>敗北</h1><h2>DEFEATED ON LEVEL ${g.L}</h2><button data-r>Retry</button><button data-m>Menu</button></div>`},1100)}

/* ---------- domain effects: every domain plays differently ---------- */
function domBegin(dx){const g=G,p=g.p,x=DM[dx.i].x;if(!dx.who){if(x=='inferno')live().forEach(e=>e.burn=6);if(x=='eclipse'){p.buff=9;p.g=Math.max(p.g,40)}}else{if(x=='inferno')p.burn=4;if(x=='eclipse')g.eb=6}}
function domEnd(dx){if(!dx.who&&DM[dx.i].x=='frost')live().forEach(e=>{hurtE(e,90+G.L*3,1);burst(e.x,GY()-70*S,'#fff',40);G.shake=20;G.flash=.5})}
function domTick(dx,dt){const g=G,p=g.p,D=DM[dx.i],x=D.x,es=live(),dps=!dx.who?24+g.L*.9:8+g.L*.5;dx.a=(dx.a||0)-dt;const pu=dx.a<=0;
 if(!dx.who){es.forEach(e=>e.st=Math.max(e.st,.3));
  if(x=='shrine'){if(pu){dx.a=.35;es.forEach(e=>{hurtE(e,dps*.5,1);burst(e.x,GY()-70*S,D.b,14)});g.shake=Math.max(g.shake,9)}}
  else if(x=='thunder'){if(pu&&es.length){dx.a=.4;const e=es[Math.random()*es.length|0];hurtE(e,dps*1.4,1);burst(e.x,GY()-70*S,D.b,25);g.flash=.3}}
  else if(x=='chaos'){if(pu){dx.a=.6;const r=Math.random()*3|0;if(r==0)p.hp=Math.min(p.mx,p.hp+18);else if(r==1)es.forEach(e=>{hurtE(e,dps*.9,1);burst(e.x,GY()-70*S,D.b,14)});else p.g=Math.min(100,p.g+12);ft(['+HEAL','CHAOS BURST','+GAUGE'][r],p.x,GY()-200*S,D.a)}}
  else{es.forEach(e=>hurtE(e,dps*{void:1,sakura:1,inferno:.5,frost:.4,eclipse:.8}[x]*dt,1));if(x=='sakura')p.hp=Math.min(p.mx,p.hp+dps*.5*dt*es.length);if(x=='void')g.pr=g.pr.filter(q=>q.o==0)}}
 else{let xx=x;if(x=='chaos'){if(pu){dx.a=.6;dx.cx=['shrine','thunder','void'][Math.random()*3|0]}xx=dx.cx||'void'}
  if(xx=='shrine'){if(pu){dx.a=.45;hurtP(dps*.6)}}
  else if(xx=='thunder'){if(pu){dx.a=.8;(dx.bl=dx.bl||[]).push({x:p.x+R(-120,120)*S,t:.7})}}
  else if(p.inv<=0)hurtP(dps*({void:.6,sakura:1,inferno:.5,frost:.5,eclipse:.5}[xx]||.6)*dt,1);
  (dx.bl||[]).forEach(b=>{b.t-=dt;if(b.t<=0&&!b.d){b.d=1;g.flash=.4;g.shake=14;if(Math.abs(p.x-b.x)<65*S)hurtP(dps*2.2)}});dx.bl=(dx.bl||[]).filter(b=>b.t>-.15)}}

/* ---------- update ---------- */
function upd(rd){const g=G,p=g.p;if(g.paused)return;let dt=rd;if(g.slow>0){g.slow-=rd;dt*=.35}if(g.pk)dt*=.05;let dx=g.dx;if(dx&&dx.ph=='c')dt*=.2;
 g.t+=dt;g.shake*=Math.pow(.02,rd);g.flash=Math.max(0,g.flash-rd*2.4);const x=dx&&DM[dx.i].x,slow=dx&&dx.who==1&&dx.ph=='h'?(x=='frost'||x=='void'?.3:.7):1;
 for(const k of['jc','kc','dc','inv','hit','pfc','buff','eb','ct'])if(k=='eb'||k=='buff'||k=='ct'?0:1)p[k]-=dt;p.buff-=dt;g.eb-=dt;g.ct-=dt;if(g.ct<=0)g.cb=0;
 if(!g.end){if(!g.pk){if(K.KeyJ)melee();if(K.KeyK)blast()}const mv=(K.KeyD?1:0)-(K.KeyA?1:0);p.mv=mv&&p.dash<=0?1:0;
  if(p.dash>0){p.dash-=dt;p.x+=p.dv*dt;p.tr.push({x:p.x,l:.25})}else p.x+=mv*260*S*slow*dt;p.x=cl(p.x,40,W-40);
  const ne=live().sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];if(ne)p.face=ne.x>=p.x?1:-1;p.g=Math.min(100,p.g+dt*1.5)}
 p.tr.forEach(t=>t.l-=dt);p.tr=p.tr.filter(t=>t.l>0);if(p.burn>0){p.burn-=dt;hurtP((5+g.L*.3)*dt,1)}
 if(dx&&dx.who==0)p.inv=Math.max(p.inv,.1);
 for(const e of live()){e.hit-=dt;e.st-=dt;e.dc-=dt;e.mv=0;e.face=p.x<e.x?-1:1;if(e.burn>0){e.burn-=dt;hurtE(e,(10+g.L*.4)*dt,1)}if(e.st>0||g.end)continue;
  const d=p.x-e.x,ad=Math.abs(d),sp=(80+g.L*1.6)*S*[1,.9,.65,1.7][e.ty],ed=g.ed*(g.eb>0?1:1);
  if(e.wd>0){e.wd-=dt;if(e.wd<=0&&ad<160*S*e.sc)hurtP(ed*(e.ty==2?1.6:1))}
  else{if(ad>e.pref+25*S){e.x+=Math.sign(d)*sp*dt;e.mv=1}else if(ad<e.pref-25*S){e.x-=Math.sign(d)*sp*dt;e.mv=1}
   if(e.ty!=1){e.cd-=dt;if(e.cd<=0&&ad<140*S*e.sc){e.wd=e.ty==3?.25:.4;e.cd=R(1.2,2.2)}}
   e.pc-=dt;if(e.pc<=0){e.pc=Math.max(.9,R(2,4)-g.L*.04)*(e.ty==1?.55:e.ty==2?1.6:1.1);for(let k=0,n=e.ty==1?3:1;k<n;k++)g.pr.push({x:e.x-e.face*k*55*S,y:GY()-80*S,vx:e.face*(320+g.L*4)*S,o:1,d:ed*.9,c:DM[e.dm].a})}}
  if(!g.dx&&e.dc<=0){e.dc=Math.max(10,R(18,28)-g.L*.3);g.dx={who:1,i:e.dm,ph:'c',t:0,c:e};dx=g.dx;closePick()}
  e.x=cl(e.x,40,W-40)}
 for(let i=g.pr.length-1;i>=0;i--){const q=g.pr[i];q.x+=q.vx*dt;let dead=q.x<-50||q.x>W+50;
  if(q.o==0){for(const e of live())if(Math.abs(q.x-e.x)<40*S&&!q.h.includes(e)){hit(e,q.d);q.h.push(e);if(!q.pi)dead=true}}
  else if(Math.abs(q.x-p.x)<30*S){if(p.inv<=0){hurtP(q.d);dead=true}else if(p.dash>0&&!q.pf){q.pf=1;perfect()}}
  if(dead)g.pr.splice(i,1)}
 for(const q of g.pt){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt;q.l-=dt}g.pt=g.pt.filter(q=>q.l>0);
 for(const s of g.sl)s.t+=dt;g.sl=g.sl.filter(s=>s.t<.18);g.ft.forEach(f=>f.t+=rd);g.ft=g.ft.filter(f=>f.t<1.1);
 if(dx){dx.t+=rd*(dx.ph=='c'?.2:1);const T={c:1,e:1,h:3.6,o:.7}[dx.ph];if(dx.ph=='h')domTick(dx,dt);
  if(dx.t>T){const nx={c:'e',e:'h',h:'o',o:null}[dx.ph];if(nx){dx.ph=nx;dx.t=0;if(nx=='e'){boom();g.shake=30;g.flash=1}if(nx=='h')domBegin(dx);if(nx=='o')domEnd(dx)}else g.dx=null}}
 if(!g.end){if(!live().length)finish(1);else if(p.hp<=0)finish(0)}}

function render(){const g=G,p=g.p,dx=g.dx,y=GY();ctx.save();if(g.shake>.3)ctx.translate(R(-1,1)*g.shake,R(-1,1)*g.shake);bg();
 let D=null,rv=0;if(dx){D=DM[dx.i];rv={c:0,e:ease(dx.t),h:1,o:1-Math.pow(dx.t/.7,2)}[dx.ph];const c=dx.who?dx.c:null,cx=c?c.x:p.x,cy=H*.55,M=Math.hypot(W,H)*.75;

 for(const t of p.tr)body(t.x,DM[p.sel].a,0,1,p.face,0,1,t.l);
 for(const e of g.es){if(e.hp<=0)continue;body(e.x,DM[e.dm].a,e.ty,e.sc,e.face,e.hit>0,pf(e));if(e.wd>0){ctx.strokeStyle='#ff4a4a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,y-120*S,30*S*(1+e.wd),0,TAU);ctx.stroke()}if(e.burn>0||e.st>0){ctx.fillStyle=e.burn>0?'#ff9a2e':'#9fe';ctx.fillRect(e.x-20*S,y-190*S*e.sc,40*S*Math.min(1,(e.burn>0?e.burn/6:e.st)),3)}}
 body(p.x,DM[p.sel].a,0,1,p.face,p.hit>0,p.jc>.15?3:p.mv||p.dash>0?1+((gt*10)|0)%2:0);
 ctx.globalCompositeOperation='lighter';
 for(const s of g.sl){const k=s.t/.18;ctx.save();ctx.translate(s.x,y-80*S);ctx.scale(s.f,1);ctx.strokeStyle=s.c;ctx.lineWidth=14*(1-k);ctx.beginPath();ctx.arc(0,0,120*S,-1.1+k*1.2,-.1+k*1.2);ctx.stroke();ctx.restore()}
